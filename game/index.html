<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARAZUL</title>
<link rel="stylesheet" href="./styles/marazul.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game-viewport" aria-label="MARAZUL, the open-world city"></canvas>

<div id="loading-screen" role="status">
  <p class="loading-title">MARAZUL</p>
  <div class="loading-track"><div id="loading-progress-bar"></div></div>
  <p id="loading-status">Starting</p>
</div>

<div id="start-menu" class="menu-screen"></div>
<div id="pause-menu" class="menu-screen"></div>

<div id="head-up-display">
  <canvas id="hud-minimap" width="220" height="220"></canvas>
  <div id="hud-wanted-stars"></div>
  <div id="hud-cash"></div>
  <div id="hud-health-and-armour"></div>
  <div id="hud-weapon-and-ammunition"></div>
  <div id="hud-mission-objective"></div>
  <div id="hud-location-name"></div>
  <div id="hud-speedometer"></div>
  <div id="hud-subtitles"></div>
</div>

<div id="city-map-screen"></div>
<div id="phone"></div>
<div id="cutscene-letterbox"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
