<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARAZUL</title>
<link rel="stylesheet" href="./styles/marazul.css">
<link rel="stylesheet" href="./styles/hud.css">
<link rel="stylesheet" href="./styles/final-mission.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<!-- three.js is the largest script: fetch it beside main.js instead of after the engine's imports. -->
<link rel="modulepreload" href="./vendor/three/three.module.min.js">
<link rel="modulepreload" href="./vendor/three/three.core.min.js">
</head>
<body>
<canvas id="game-viewport" aria-label="MARAZUL, the open-world city"></canvas>

<div id="loading-screen" role="status">
  <!-- The loading art: Marazul's towers and palms against the sunset over the gulf, drawn here so
       it shows before a single script or model has arrived. -->
  <div class="loading-art" aria-hidden="true">
    <div class="loading-sun"></div>
    <svg class="loading-skyline" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMax slice">
      <path class="loading-skyline-far" d="M0 360V250h40v-30h50v40h30v-70h60v80h40v-40h30v-60h20v-30h40v90h50v-50h60v70h40v-110h30v-20h40v130h40v-60h70v60h40v-90h50v100h40v-40h60v-80h20v-30h40v120h50v-60h40v70h60v-100h30v-30h40v120h50v-50h60v60h40v-80h50v100h40v-30h60v50h60v-40h40v-20h130v280z"/>
      <path class="loading-skyline-near" d="M0 360V300h70v-40h60v50h50v-120h20v-40h50v170h40v-90h70v100h30V140h20v-30h40v-20h10v20h40v240h40v-70h60v-150h70v230h40v-60h50v-40h60v120h40V170h30v-50h50v240h50v-90h70v60h40v-100h50v150h60v-40h60v60h60v-30h50v50h40v-70h80v-50h60v120h60V360z"/>
      <g class="loading-palms">
        <path d="M260 360q6-70 2-120M262 240q-34-6-58 14M262 240q-26-22-58-20M262 240q14-30 46-34M262 240q32-6 54 16M262 240q2-22-10-40"/>
        <path d="M1220 360q-8-80 6-140M1226 220q-36-4-60 18M1226 220q-24-26-58-24M1226 220q16-30 50-32M1226 220q34-2 56 22M1226 220q4-24-6-42"/>
        <path d="M1330 360q4-56 0-96M1330 264q-28-4-48 12M1330 264q-20-18-46-16M1330 264q12-24 38-28M1330 264q26-4 44 14"/>
      </g>
    </svg>
    <div class="loading-sea"></div>
  </div>
  <div class="loading-panel">
    <p class="loading-kicker">Golfo de Marazul</p>
    <p class="loading-title">MARAZUL</p>
    <div class="loading-meter">
      <div class="loading-track"><div id="loading-progress-bar"></div></div>
      <span id="loading-percent">0%</span>
    </div>
    <p id="loading-status">Starting</p>
    <p id="loading-tip" class="loading-tip"></p>
  </div>
</div>

<div id="start-menu" class="menu-screen"></div>
<div id="pause-menu" class="menu-screen"></div>

<div id="head-up-display">
  <canvas id="hud-minimap" width="220" height="220"></canvas>
  <div id="hud-wanted-stars"></div>
  <div id="hud-cash"></div>
  <div id="hud-health-and-armour"></div>
  <div id="hud-weapon-and-ammunition"></div>
  <div id="hud-mission-objective"></div>
  <div id="hud-location-name"></div>
  <div id="hud-speedometer"></div>
  <div id="hud-subtitles"></div>
</div>

<div id="city-map-screen"></div>
<div id="phone"></div>
<div id="cutscene-letterbox"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
