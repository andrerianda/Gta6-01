<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARAZUL asset viewer</title>
<!--
  In-engine preview of one asset, loaded by the game's own loader (game/src/assets/). Serve the
  repository root and open:

    tools/preview/asset-viewer.html?asset=street_lamp_a

  The studio (sky gradient, warm low sun, neutral ground, camera angles, field of view and the
  way the camera is fitted to the asset) repeats art/blender/lib/preview.py number for number,
  so this page and a Cycles preview of the same asset can be compared side by side. Change the
  constants in both places.

  Query parameters
    asset     the asset id in game/src/assets/registry/ (required)
    view      three_quarter (default) | front | side | back | top | low | "azimuth,elevation"
    zoom      move closer by this factor (2 = close-up)
    focus     "x,y,z" in game axes to look at instead of the asset's centre
    shots     several shots in one picture, separated by ";": each is view, view@zoom or
              view@zoom@x,y,z, for example shots=three_quarter;35,10@5@0,0.4,0 (the build runner
              prints this query for every Cycles preview it renders)
    sheet     1 draws four views around the asset in one picture (a turntable)
    lod       0 (default), 1, 2: the level of detail to show; "auto" switches by distance
    tone      aces (default) | agx | neutral | none
    lamps     0 switches every lamp material off (default: lit, as authored)
    paint     a hex colour (b01818) for the "paint" material
    clip      an animation clip name; time is the moment to show, in seconds (default 0)
    grid      1 draws a 1 m grid, the axes (+X red, +Y green, +Z blue) and a ruler with 0.5 m bands
    marks     1 draws the asset's anchors (yellow, pointing along their -Z) and collision proxies
    batch     N draws N instanced copies on a grid (one draw call per material)
    hud       0 hides the caption
  The page sets window.__previewReady and window.__gameReady when the picture is final, and
  window.__assetReport to what was loaded (triangles, draw calls, materials, anchors, bounds).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1016; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #caption { position: fixed; left: 10px; bottom: 8px; color: #fff; font: 12px/1.35 system-ui, sans-serif;
             text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": { "three": "../../game/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="caption"></div>
<script type="module">
import * as THREE from 'three';
import {
  AssetLibrary, ROLE, anchorWorld, collectAnchors, roleOfMaterial, setAllLamps, setPaint,
} from '../../game/src/assets/index.js';

// ------------------------------------------------------------------------------------------
// The studio: the same numbers as art/blender/lib/preview.py (linear colours).
// ------------------------------------------------------------------------------------------
const SKY_ZENITH = [0.22, 0.42, 0.78];
const SKY_HORIZON = [0.78, 0.84, 0.90];
const SKY_GROUND = [0.30, 0.28, 0.25];
const SUN_COLOR = [1.0, 0.84, 0.66];
const SUN_STRENGTH = 3.4;
const SUN_AZIMUTH = -42;
const SUN_ELEVATION = 32;
const GROUND_COLOR = [0.33, 0.32, 0.30];
const GROUND_ROUGHNESS = 0.9;
const FIELD_OF_VIEW = 30;
const FRAME_MARGIN = 1.12;
// What the environment map shows below the horizon: the sunlit ground itself, standing in for
// the light Cycles bounces off the ground plane.
const ENVIRONMENT_GROUND = [0.36, 0.33, 0.29];
const VIEWS = {
  three_quarter: [35, 16], front: [0, 6], side: [90, 6], back: [215, 16], top: [20, 62], low: [35, 2],
};
const TONES = {
  aces: THREE.ACESFilmicToneMapping, agx: THREE.AgXToneMapping, neutral: THREE.NeutralToneMapping,
  none: THREE.NoToneMapping,
};

const query = new URLSearchParams(location.search);
const caption = document.getElementById('caption');

/**
 * The unit vector from the subject towards a camera or light, in game axes. Azimuth runs from
 * the asset's front (-Z) towards its right (+X); elevation is above the ground.
 */
function directionOf(azimuthDegrees, elevationDegrees) {
  const azimuth = THREE.MathUtils.degToRad(azimuthDegrees);
  const elevation = THREE.MathUtils.degToRad(elevationDegrees);
  return new THREE.Vector3(Math.sin(azimuth) * Math.cos(elevation), Math.sin(elevation),
    -Math.cos(azimuth) * Math.cos(elevation));
}

function linearColor(rgb) {
  return new THREE.Color().setRGB(rgb[0], rgb[1], rgb[2], THREE.LinearSRGBColorSpace);
}

/** A dome with the studio's sky gradient; `ground` is the colour below the horizon. */
function makeSkyDome(radius, ground) {
  const material = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      zenith: { value: linearColor(SKY_ZENITH) },
      horizon: { value: linearColor(SKY_HORIZON) },
      ground: { value: linearColor(ground) },
    },
    vertexShader: `
      varying vec3 vDirection;
      void main() {
        vDirection = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 zenith;
      uniform vec3 horizon;
      uniform vec3 ground;
      varying vec3 vDirection;
      void main() {
        float height = normalize(vDirection).y;
        float up = pow(max(height, 0.0), 0.45);
        float down = clamp(max(-height, 0.0) / 0.15, 0.0, 1.0);
        gl_FragColor = vec4(mix(mix(horizon, zenith, up), ground, down), 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 24), material);
  dome.frustumCulled = false;
  return dome;
}

/** Places the camera so the box just fills the frame from the given angles (see preview.py). */
function fitCamera(camera, box, azimuth, elevation, aspect, zoom, focus) {
  const centre = focus ?? box.getCenter(new THREE.Vector3());
  const back = directionOf(azimuth, elevation);
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), back);
  if (right.lengthSq() < 1e-12) right.set(1, 0, 0);
  right.normalize();
  const up = new THREE.Vector3().crossVectors(back, right).normalize();
  const tanY = Math.tan(THREE.MathUtils.degToRad(FIELD_OF_VIEW) / 2);
  const tanX = tanY * aspect;
  let distance = 0.1;
  const offset = new THREE.Vector3();
  for (const x of [box.min.x, box.max.x]) {
    for (const y of [box.min.y, box.max.y]) {
      for (const z of [box.min.z, box.max.z]) {
        offset.set(x, y, z).sub(centre);
        const depth = offset.dot(back);
        distance = Math.max(distance, Math.abs(offset.dot(right)) / tanX + depth,
          Math.abs(offset.dot(up)) / tanY + depth);
      }
    }
  }
  distance = (distance * FRAME_MARGIN) / zoom;
  camera.fov = FIELD_OF_VIEW;
  camera.aspect = aspect;
  camera.near = 0.05;
  camera.far = 2000;
  camera.position.copy(centre).addScaledVector(back, distance);
  camera.up.set(0, 1, 0);
  camera.lookAt(centre);
  camera.updateProjectionMatrix();
}

function viewAngles(name) {
  if (VIEWS[name]) return VIEWS[name];
  const parts = name.split(',').map(Number);
  if (parts.length !== 2 || parts.some(Number.isNaN)) throw new Error(`unknown view "${name}"`);
  return parts;
}

/** A 1 m grid, the three axes with labels and a ruler with 0.5 m bands, for convention checks. */
function makeGrid(box) {
  const group = new THREE.Group();
  const grid = new THREE.GridHelper(20, 20, 0x202020, 0x505050);
  grid.position.y = 0.004;
  group.add(grid);
  const axes = [[1, 0, 0, 0xff2020, '+X'], [0, 1, 0, 0x20d020, '+Y'], [0, 0, 1, 0x3060ff, '+Z']];
  const length = 1.6;
  for (const [x, y, z, color, label] of axes) {
    const points = [new THREE.Vector3(0, 0.01, 0), new THREE.Vector3(x, y, z).multiplyScalar(length).setY(y * length + 0.01)];
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({ color, toneMapped: false }));
    group.add(line);
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 64;
    const context = canvas.getContext('2d');
    context.font = 'bold 44px system-ui, sans-serif';
    context.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
    context.textAlign = 'center';
    context.fillText(label, 64, 46);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(canvas), toneMapped: false, depthTest: false,
    }));
    sprite.scale.set(0.8, 0.4, 1);
    sprite.position.copy(points[1]).add(new THREE.Vector3(x, y, z).multiplyScalar(0.25));
    group.add(sprite);
  }
  const bands = Math.max(2, Math.ceil(box.max.y / 0.5));
  for (let band = 0; band < bands; band += 1) {
    const piece = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.06),
      new THREE.MeshBasicMaterial({ color: band % 2 ? 0xf2f2f2 : 0x151515, toneMapped: false }));
    piece.position.set(box.min.x - 0.4, 0.25 + band * 0.5, box.max.z + 0.4);
    group.add(piece);
  }
  return group;
}

/** Yellow arrows for anchors and wireframes for collision proxies. */
function makeMarks(asset, instance) {
  const group = new THREE.Group();
  const size = Math.max(0.15, asset.bounds.getSize(new THREE.Vector3()).length() * 0.06);
  for (const node of Object.values(collectAnchors(instance))) {
    const { position, direction } = anchorWorld(node);
    group.add(new THREE.ArrowHelper(direction, position, size * 2, 0xffd000, size * 0.6, size * 0.35));
  }
  const material = new THREE.LineBasicMaterial({ color: 0x00e0ff, toneMapped: false });
  for (const collider of asset.colliders) {
    let geometry;
    if (collider.geometry) geometry = collider.geometry;
    else if (collider.shape === 'cyl') geometry = new THREE.CylinderGeometry(collider.radius, collider.radius, collider.height, 16);
    else if (collider.shape === 'sphere') geometry = new THREE.SphereGeometry(collider.radius, 12, 8);
    else geometry = new THREE.BoxGeometry(collider.size.x, collider.size.y, collider.size.z);
    const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geometry), material);
    if (!collider.geometry) {
      wire.position.copy(collider.position);
      wire.quaternion.copy(collider.quaternion);
    }
    group.add(wire);
  }
  return group;
}

async function main() {
  const assetId = query.get('asset');
  if (!assetId) throw new Error('add ?asset=<id> to the address (ids are in game/src/assets/registry/)');

  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = TONES[query.get('tone') ?? 'aces'] ?? THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;

  const scene = new THREE.Scene();
  scene.add(makeSkyDome(900, SKY_GROUND));
  const environmentScene = new THREE.Scene();
  environmentScene.add(makeSkyDome(10, ENVIRONMENT_GROUND));
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(environmentScene, 0, 0.1, 100).texture;
  pmrem.dispose();

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: linearColor(GROUND_COLOR), roughness: GROUND_ROUGHNESS, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const assets = new AssetLibrary({ renderer });
  await assets.load([assetId], {
    onProgress: ({ fraction }) => { caption.textContent = `loading ${assetId} ${Math.round(fraction * 100)} %`; },
  });
  const asset = assets.get(assetId);
  const lodParam = query.get('lod') ?? '0';
  const batchCount = Number(query.get('batch') ?? 0);
  const box = asset.bounds.clone();
  let instance = null;
  if (batchCount > 0) {
    const batch = asset.createBatch(batchCount, { lod: Number(lodParam) || 0 });
    const size = asset.bounds.getSize(new THREE.Vector3());
    const pitch = Math.max(size.x, size.z) * 1.6 + 0.5;
    const columns = Math.ceil(Math.sqrt(batchCount));
    const matrix = new THREE.Matrix4();
    for (let index = 0; index < batchCount; index += 1) {
      const x = ((index % columns) - (columns - 1) / 2) * pitch;
      const z = (Math.floor(index / columns) - (columns - 1) / 2) * pitch;
      matrix.makeRotationY(index * 2.399963).setPosition(x, 0, z);
      batch.setMatrixAt(index, matrix);
    }
    batch.setCount(batchCount);
    batch.commit();
    scene.add(batch.object);
    box.setFromObject(batch.object);
  } else {
    instance = lodParam === 'auto' ? asset.createLOD() : asset.instantiate({ lod: Number(lodParam) || 0 });
    if (query.get('lamps') === '0') setAllLamps(instance, false);
    if (query.has('paint')) setPaint(instance, `#${query.get('paint').replace('#', '')}`);
    if (query.has('clip')) {
      const mixer = new THREE.AnimationMixer(instance);
      mixer.clipAction(asset.clip(query.get('clip'))).play();
      mixer.setTime(Number(query.get('time') ?? 0));
    }
    scene.add(instance);
    instance.updateMatrixWorld(true);
  }
  box.min.y = Math.min(box.min.y, 0);

  const sun = new THREE.DirectionalLight(linearColor(SUN_COLOR), SUN_STRENGTH);
  const reach = box.getBoundingSphere(new THREE.Sphere());
  const toSun = directionOf(SUN_AZIMUTH, SUN_ELEVATION);
  sun.position.copy(reach.center).addScaledVector(toSun, reach.radius * 4 + 10);
  sun.target.position.copy(reach.center);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const extent = reach.radius * 1.6 + 0.5;
  Object.assign(sun.shadow.camera, { left: -extent, right: extent, top: extent, bottom: -extent,
    near: 0.5, far: reach.radius * 8 + 20 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.012 * Math.max(1, reach.radius / 3);
  sun.shadow.radius = 3;
  scene.add(sun, sun.target);

  if (query.get('grid') === '1') scene.add(makeGrid(box));
  if (query.get('marks') === '1' && instance) scene.add(makeMarks(asset, instance));

  const defaultFocus = query.has('focus')
    ? new THREE.Vector3(...query.get('focus').split(',').map(Number)) : null;
  const defaultZoom = Number(query.get('zoom') ?? 1);
  /** One shot: "view", "view@zoom" or "view@zoom@x,y,z" (the point looked at, in game axes). */
  const parseShot = (text) => {
    const parts = text.split('@');
    const [azimuth, elevation] = viewAngles(parts[0]);
    return {
      azimuth,
      elevation,
      zoom: parts[1] ? Number(parts[1]) : defaultZoom,
      focus: parts[2] ? new THREE.Vector3(...parts[2].split(',').map(Number)) : defaultFocus,
    };
  };
  const camera = new THREE.PerspectiveCamera();
  let shots = [parseShot(query.get('view') ?? 'three_quarter')];
  if (query.has('shots')) shots = query.get('shots').split(';').map(parseShot);
  else if (query.get('sheet') === '1') shots = [0, 1, 2, 3].map((index) => parseShot(`${35 + 90 * index},14`));
  // The same contact-sheet layout as art/blender/lib/preview.py sheet_layout().
  const columns = shots.length <= 1 ? 1 : shots.length <= 4 ? 2 : 3;
  const rows = Math.ceil(shots.length / columns);

  let drawCalls = 0;
  let triangles = 0;
  function draw() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    renderer.setSize(width, height, false);
    renderer.info.autoReset = false;
    renderer.info.reset();
    const cellWidth = Math.floor(width / columns);
    const cellHeight = Math.floor(height / rows);
    renderer.setScissorTest(shots.length > 1);
    shots.forEach((shot, index) => {
      const left = (index % columns) * cellWidth;
      const bottom = height - cellHeight - Math.floor(index / columns) * cellHeight;
      renderer.setViewport(left, bottom, cellWidth, cellHeight);
      renderer.setScissor(left, bottom, cellWidth, cellHeight);
      fitCamera(camera, box, shot.azimuth, shot.elevation, cellWidth / cellHeight, shot.zoom, shot.focus);
      renderer.render(scene, camera);
    });
    drawCalls = renderer.info.render.calls;
    triangles = renderer.info.render.triangles;
  }

  // What was loaded, for the caption, the console and the tests.
  let assetTriangles = 0;
  let assetDraws = 0;
  (instance ?? scene).traverse((node) => {
    if (!node.isMesh || node === ground || node.material.isShaderMaterial || node.material.isMeshBasicMaterial) return;
    if (!node.visible) return;
    const geometry = node.geometry;
    const count = geometry.index ? geometry.index.count : geometry.attributes.position.count;
    assetTriangles += (count / 3) * (node.isInstancedMesh ? node.count : 1);
    assetDraws += 1;
  });
  const report = {
    asset: assetId,
    kind: asset.kind,
    lods: asset.lodCount,
    lodDistances: asset.lodDistances,
    triangles: assetTriangles,
    draws: assetDraws,
    materials: [...asset.materials.values()].map((material) => `${material.name}:${roleOfMaterial(material)}`),
    lamps: asset.materialsByRole(ROLE.LAMP).map((material) => material.name),
    anchors: Object.fromEntries(Object.values(asset.anchors).map((anchor) => [anchor.name, {
      position: anchor.position.toArray().map((value) => Math.round(value * 1000) / 1000),
      direction: anchor.direction.toArray().map((value) => Math.round(value * 1000) / 1000),
    }])),
    colliders: asset.colliders.map((collider) => `${collider.name}:${collider.shape}`),
    bounds: [...asset.bounds.min.toArray(), ...asset.bounds.max.toArray()].map((value) => Math.round(value * 1000) / 1000),
    extras: asset.extras,
  };
  window.__assetReport = report;
  console.log(`asset-viewer ${JSON.stringify(report)}`);

  const size = asset.bounds.getSize(new THREE.Vector3());
  if (query.get('hud') !== '0') {
    caption.textContent = `${assetId} (${asset.kind})  lod ${lodParam} of ${asset.lodCount}`
      + `  ${Math.round(assetTriangles).toLocaleString('en')} triangles, ${assetDraws} draw calls`
      + `  ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} m (x, up, z)`
      + `\nmaterials: ${report.materials.join(', ')}`;
  } else {
    caption.textContent = '';
  }

  // Draw a few frames so every texture is decoded and uploaded, then report ready.
  let frames = 0;
  renderer.setAnimationLoop(() => {
    draw();
    frames += 1;
    if (frames === 4) {
      window.__frameInfo = { drawCalls, triangles };
      window.__previewReady = true;
      window.__gameReady = true;
    }
  });
  window.addEventListener('resize', draw);
}

main().catch((error) => {
  caption.textContent = `asset viewer failed: ${error.message}`;
  console.error(error);
  window.__previewError = String(error.message ?? error);
});
</script>
</body>
</html>
