<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MARAZUL city block preview</title>
<!--
  City dressing preview: builds the sectors around a point of a staging street from the real
  city plan with game/src/world/buildings/cityDressing.js (buildings, street lamps, palms) under
  the finished atmosphere. The ground and the roads here are a plain stand-in (the open-world
  city builds the real ones). Serve the repository root:

    node tools/capture.mjs --root . --size 960x540 \
      --page "tools/preview/city-block.html?street=gran_via&at=0.55&time=18.85" --out /tmp/marazul/city-dressing/gran-via.jpg

  Parameters
    street    gran_via (Gran Via Marazul, default) or bulevar (Bulevar Dorado)
    at        0..1 along the street from its east end (default 0.5)
    side      metres right of the centre line for the camera (default 5)
    eye       camera height above the road (default 2.2)
    look      metres ahead the camera looks at (default 160); lift: its height (default 14)
    turn      degrees to turn the view left of the street direction (default 0)
    radius    metres of sectors built around the camera (default 420)
    time, weather, quality, frames   as the atmosphere preview (default 18.85, clear, high, 4)
    assets    comma list of built asset ids to load (default street_lamp_a,set_street_lighting,royal_palm_a)
  window.__previewStats: sectors, buildings, modules, triangles, dressing draw calls (near and far
  levels as drawn from the camera), build milliseconds.
-->
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } canvas { width: 100%; height: 100%; display: block; }</style>
<script type="importmap">
{ "imports": { "three": "../../game/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<script type="module">
import * as THREE from 'three';
import { AssetLibrary } from '../../game/src/assets/index.js';
import { createSeededRandom } from '../../game/src/core/random/seededRandom.js';
import { createAtmosphere } from '../../game/src/render/lighting/atmosphere.js';
import { createSurfaceLibrary } from '../../game/src/render/textures/surfaceMaterials.js';
import { applyWetSurface } from '../../game/src/render/weather/wetSurface.js';
import { createCityDressing } from '../../game/src/world/buildings/cityDressing.js';
import { generateCityPlan } from '../../game/src/world/plan/cityPlanGenerator.js';

const query = new URLSearchParams(location.search);
const num = (name, fallback) => (query.has(name) ? Number(query.get(name)) : fallback);
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight, false);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.3, 6000);
const quality = query.get('quality') ?? 'high';
const atmosphere = createAtmosphere(renderer, scene, camera, { quality });
const surfaces = createSurfaceLibrary({ wetSurface: applyWetSurface });

const started = performance.now();
const plan = generateCityPlan(createSeededRandom('marazul'));
const streetKey = query.get('street') === 'bulevar' ? 'bulevar_dorado' : 'gran_via_marazul';
const street = plan.stagingStreets.find((each) => each.key === streetKey);
const at = num('at', 0.5);
const px = street.eastEnd.x + (street.westEnd.x - street.eastEnd.x) * at;
const pz = street.eastEnd.z + (street.westEnd.z - street.eastEnd.z) * at;
const length = Math.hypot(street.westEnd.x - street.eastEnd.x, street.westEnd.z - street.eastEnd.z);
const dx = (street.westEnd.x - street.eastEnd.x) / length;
const dz = (street.westEnd.z - street.eastEnd.z) / length;
const side = num('side', 5);
const camX = px - dz * side;
const camZ = pz + dx * side;
const groundY = plan.heightAt(camX, camZ);
camera.position.set(camX, groundY + num('eye', 2.2), camZ);
const turn = THREE.MathUtils.degToRad(num('turn', 0));
const lx = dx * Math.cos(turn) + dz * Math.sin(turn);
const lz = dz * Math.cos(turn) - dx * Math.sin(turn);
const look = num('look', 160);
camera.lookAt(camX + lx * look, groundY + num('lift', 14), camZ + lz * look);
camera.updateMatrixWorld();

const assetIds = (query.get('assets') ?? 'street_lamp_a,set_street_lighting,royal_palm_a').split(',').filter(Boolean);
const assets = new AssetLibrary({ renderer });
await assets.load(assetIds);

const radius = num('radius', 420);
const world = new THREE.Group();
scene.add(world);
buildStandInGround(world, camX, camZ, radius + 128);

const dressing = createCityDressing({ plan, assets, textures: surfaces, physics: null, atmosphere, random: createSeededRandom('marazul'), quality: { lodBias: 1, propDensity: 1, vegetationDensity: 1 }, sliceMs: Infinity });
const sectors = plan.sectors;
const built = [];
const buildStart = performance.now();
for (let r = 0; r < sectors.rows; r += 1) {
  for (let c = 0; c < sectors.columns; c += 1) {
    const minX = sectors.minX + c * sectors.size;
    const minZ = sectors.minZ + r * sectors.size;
    const cx = minX + sectors.size / 2;
    const cz = minZ + sectors.size / 2;
    if (Math.hypot(cx - camX, cz - camZ) > radius) continue;
    const cell = sectors.cells[r * sectors.columns + c];
    const bounds = { minX, minZ, maxX: minX + sectors.size, maxZ: minZ + sectors.size };
    const lots = cell.lots.map((id) => plan.lots.find((lot) => lot.id === id)).filter((lot) => lot && lot.x >= minX && lot.x < bounds.maxX && lot.z >= minZ && lot.z < bounds.maxZ);
    const sector = await dressing.buildSector({ id: `${c}_${r}`, bounds, lots, roads: cell.segments, intersections: cell.nodes, specialAreas: [] });
    world.add(sector.object3d);
    built.push(sector);
  }
}
const buildMs = performance.now() - buildStart;
surfaces.drain?.();

const focus = { position: camera.position.clone(), groundLevel: groundY, speed: 0 };
const time = num('time', 18.85);
atmosphere.setWeather(query.get('weather') ?? 'clear', 0);
const frames = num('frames', 4);
for (let i = 0; i < frames; i += 1) {
  if (i === 0) atmosphere.settle({ timeOfDay: time, focus });
  else atmosphere.update(1 / 30, { timeOfDay: time, focus });
  dressing.update();
  atmosphere.render();
}

let nearDraws = 0;
let farDraws = 0;
let drawnTriangles = 0;
for (const sector of built) {
  const lod = sector.object3d;
  const level = lod.getCurrentLevel();
  lod.levels[level].object.traverse((node) => {
    if (!node.isMesh || (node.count ?? 1) === 0) return;
    if (level === 0) nearDraws += 1; else farDraws += 1;
    const geometry = node.geometry;
    drawnTriangles += ((geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3) * (node.isInstancedMesh ? node.count : 1);
  });
}
const sum = (key) => built.reduce((total, sector) => total + (sector.stats[key] ?? 0), 0);
window.__previewStats = {
  sectors: built.length, buildings: sum('buildings'), modules: sum('modules'), nearTriangles: Math.round(sum('triangles')),
  lamps: sum('lamps'), plants: sum('plants'), lights: built.reduce((t, s) => t + s.lights.length, 0),
  dressingDraws: nearDraws + farDraws, nearDraws, farDraws, drawnTriangles: Math.round(drawnTriangles), buildMs: Math.round(buildMs), totalMs: Math.round(performance.now() - started),
  rendererCalls: renderer.info.render.calls, rendererTriangles: renderer.info.render.triangles,
};
window.__previewReady = true;
window.__gameReady = true;

/** A plain stand-in for the open-world city's ground: terrain coloured by surface, roads, pavements. */
function buildStandInGround(parent, centreX, centreZ, half) {
  const step = 4;
  const count = Math.ceil((half * 2) / step) + 1;
  const positions = new Float32Array(count * count * 3);
  const colors = new Float32Array(count * count * 3);
  const palette = { paved: [0.42, 0.41, 0.4], sand: [0.86, 0.77, 0.6], grass: [0.3, 0.42, 0.2], dirt: [0.45, 0.38, 0.3], water: [0.3, 0.32, 0.3] };
  const x0 = Math.floor((centreX - half) / step) * step;
  const z0 = Math.floor((centreZ - half) / step) * step;
  for (let j = 0; j < count; j += 1) {
    for (let i = 0; i < count; i += 1) {
      const x = x0 + i * step;
      const z = z0 + j * step;
      const k = (j * count + i) * 3;
      positions[k] = x; positions[k + 1] = plan.heightAt(x, z) - 0.05; positions[k + 2] = z;
      const color = plan.lotAt(x, z) ? [0.62, 0.6, 0.57] : palette[plan.surfaceAt(x, z)] ?? palette.paved;
      colors[k] = color[0] ** 2.2; colors[k + 1] = color[1] ** 2.2; colors[k + 2] = color[2] ** 2.2;
    }
  }
  const index = [];
  for (let j = 0; j < count - 1; j += 1) {
    for (let i = 0; i < count - 1; i += 1) {
      const a = j * count + i;
      index.push(a, a + count, a + 1, a + 1, a + count, a + count + 1);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setIndex(index);
  geometry.computeVertexNormals();
  const terrain = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  terrain.receiveShadow = true;
  parent.add(terrain);

  const asphalt = surfaces.getMaterial('asphalt');
  const paving = surfaces.getMaterial('pavingSlabs');
  const ribbons = { road: [], walk: [], median: [] };
  for (const segment of plan.roads.segments) {
    const p = segment.points;
    let near = false;
    for (let i = 0; i < p.length; i += 2) if (Math.abs(p[i] - centreX) < half && Math.abs(p[i + 1] - centreZ) < half) near = true;
    if (!near || segment.paved === false) continue;
    ribbon(ribbons.road, segment, -segment.halfWidth, segment.halfWidth, 0.02);
    if (segment.sidewalkLeft > 0) ribbon(ribbons.walk, segment, segment.halfWidth, segment.halfWidth + segment.sidewalkLeft, 0.16);
    if (segment.sidewalkRight > 0) ribbon(ribbons.walk, segment, -segment.halfWidth - segment.sidewalkRight, -segment.halfWidth, 0.16);
    if (segment.medianWidth > 1.5) ribbon(ribbons.median, segment, -segment.medianWidth / 2, segment.medianWidth / 2, 0.18);
  }
  parent.add(ribbonMesh(ribbons.road, asphalt));
  parent.add(ribbonMesh(ribbons.walk, paving));
  parent.add(ribbonMesh(ribbons.median, paving));
}

function ribbon(out, segment, from, to, lift) {
  const p = segment.points;
  let along = 0;
  for (let i = 0; i + 3 < p.length; i += 2) {
    const ax = p[i]; const az = p[i + 1]; const bx = p[i + 2]; const bz = p[i + 3];
    const length = Math.hypot(bx - ax, bz - az);
    if (length < 1e-4) continue;
    const ux = (bx - ax) / length; const uz = (bz - az) / length;
    const lx = uz; const lz = -ux;
    const ya = (segment.heights[i / 2] ?? plan.heightAt(ax, az)) + lift;
    const yb = (segment.heights[i / 2 + 1] ?? plan.heightAt(bx, bz)) + lift;
    const quad = [
      [ax + lx * from, ya, az + lz * from, from, along], [bx + lx * from, yb, bz + lz * from, from, along + length],
      [bx + lx * to, yb, bz + lz * to, to, along + length], [ax + lx * to, ya, az + lz * to, to, along],
    ];
    for (const k of [0, 1, 2, 0, 2, 3]) out.push(quad[k]);
    along += length;
  }
}

function ribbonMesh(vertices, material) {
  const positions = new Float32Array(vertices.length * 3);
  const uvs = new Float32Array(vertices.length * 2);
  vertices.forEach((v, i) => { positions.set([v[0], v[1], v[2]], i * 3); uvs.set([v[3], v[4]], i * 2); });
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.receiveShadow = true;
  return mesh;
}
</script>
</body>
</html>
