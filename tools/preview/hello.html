<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARAZUL preview: hello</title>
<!--
  The smallest working preview page: it imports three.js through the import map, draws a lit
  object and says when its picture is complete. Copy it to start a preview of your own module.
  Serve the repository root and open, or capture:

    node tools/capture.mjs --root . --page "tools/preview/hello.html?shape=knot" --size 960x540 --out /tmp/marazul/<your area>/hello.jpg

  Query parameters
    shape     knot (default) | sphere | box
    spin      radians to turn the shape about its vertical axis (default 0.6)
  The page sets window.__previewReady and window.__gameReady after the first frame is drawn, and
  window.__previewStats to what it drew ({ shape, triangles }).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1016; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "../../game/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<script type="module">
import * as THREE from 'three';
// A preview of a game module imports it by relative path, exactly as the game would:
//   import { createSomething } from '../../game/src/some-area/something.js';

const query = new URLSearchParams(location.search);
const shapeName = query.get('shape') ?? 'knot';
const spin = Number(query.get('spin') ?? 0.6);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4e4);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.2, 2.2, 5.4);
camera.lookAt(0, 1.1, 0);

// Sky light from above, warm bounce from the ground, and a low warm sun that casts the shadow.
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x8a7458, 1.1));
const sun = new THREE.DirectionalLight(0xffe2b8, 3.2);
sun.position.set(-4, 6, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0xb9ad98, roughness: 0.92 }),
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const SHAPES = {
  knot: () => new THREE.TorusKnotGeometry(0.62, 0.22, 220, 32),
  sphere: () => new THREE.SphereGeometry(0.9, 64, 32),
  box: () => new THREE.BoxGeometry(1.3, 1.3, 1.3),
};
const geometry = (SHAPES[shapeName] ?? SHAPES.knot)();
const shape = new THREE.Mesh(
  geometry,
  new THREE.MeshPhysicalMaterial({ color: 0x1c6a6e, roughness: 0.32, metalness: 0.1, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
);
shape.position.y = 1.15;
shape.rotation.y = spin;
shape.castShadow = true;
shape.receiveShadow = true;
scene.add(shape);

renderer.render(scene, camera);

// Ready means the picture is complete: say so only after the frame above has been presented.
requestAnimationFrame(() => {
  window.__previewStats = { shape: SHAPES[shapeName] ? shapeName : 'knot', triangles: renderer.info.render.triangles };
  window.__previewReady = true;
  window.__gameReady = true;
});
</script>
</body>
</html>
